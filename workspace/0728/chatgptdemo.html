<!-- HTML5 文件宣告 -->
<!DOCTYPE html>

<html lang="zh-Hant">

<head>
    <!-- 指定網頁使用 UTF-8 編碼，避免中文亂碼 -->
    <meta charset="UTF-8">

    <!-- 讓網頁可以在手機上正常縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 網頁標題 -->
    <title>我的第一個網頁</title>
</head>

<body>

    <!-- 網頁主要標題 -->
    <h1>歡迎來到我的網站</h1>

    <!-- 段落文字 -->
    <p>這是 HTML5 的基本範例。</p>

</body>

</html>
