<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>立即訂位 | Ristorante Gusto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- 導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-egg-fried me-2"></i>Ristorante Gusto</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">關於我們</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">美味菜單</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">線上訂位</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">門市資訊</a></li>
          <li class="nav-item ms-lg-3">
            <a class="btn btn-custom text-white active" href="booking-now.html"><i class="bi bi-calendar-check me-1"></i>立即訂位</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 快速訂位頁 -->
  <main class="container py-5 mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
          <div class="text-center mb-4">
            <h2 class="section-title fw-bold">快速線上預約</h2>
            <p class="text-muted">填寫以下資料，立即為您保留席位</p>
          </div>
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">您的姓名</label>
                <input type="text" class="form-control" required placeholder="例如：張先生 / 小姐">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">行動電話</label>
                <input type="tel" class="form-control" required placeholder="0912345678">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">用餐人數</label>
                <select class="form-select" required>
                  <option value="1">1 位</option>
                  <option value="2" selected>2 位</option>
                  <option value="3">3 位</option>
                  <option value="4">4 位</option>
                  <option value="5+">5 位以上</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">預約日期</label>
                <input type="date" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">時段</label>
                <select class="form-select" required>
                  <option>12:00</option>
                  <option>12:30</option>
                  <option>18:00</option>
                  <option>18:30</option>
                  <option>19:00</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label fw-bold">備註需求</label>
                <textarea class="form-control" rows="3" placeholder="如有特殊飲食需求或兒童椅需求請在此說明"></textarea>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-custom w-100 py-3 fs-5 fw-bold">立即送出訂位</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center mt-5">
    <div class="container">
      <p class="mb-0 small text-secondary">&copy; 2026 Ristorante Gusto. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
