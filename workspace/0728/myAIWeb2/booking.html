<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上訂位 | Ristorante Gusto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-egg-fried me-2"></i>Ristorante Gusto</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">關於我們</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">美味菜單</a></li>
          <li class="nav-item"><a class="nav-link active" href="booking.html">線上訂位</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">門市資訊</a></li>
          <li class="nav-item ms-lg-3">
            <a class="btn btn-custom text-white" href="booking-now.html"><i class="bi bi-calendar-check me-1"></i>立即訂位</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 頁頭 -->
  <header class="page-header">
    <div class="container">
      <h1 class="fw-bold">線上訂位</h1>
      <p class="mb-0">Table Reservation & Notice</p>
    </div>
  </header>

  <!-- 訂位須知與表單 -->
  <section class="py-5">
    <div class="container py-4">
      <div class="booking-section p-4 p-md-5 shadow-sm">
        <div class="row align-items-center">
          <div class="col-lg-5 mb-4 mb-lg-0">
            <h2 class="section-title">線上即時預約</h2>
            <p class="text-muted">預約您的義式美食之旅，享受無與倫比的用餐體驗。</p>
            <hr class="my-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-exclamation-circle text-danger me-2"></i>訂位須知</h5>
            <ul class="list-unstyled lh-lg text-secondary">
              <li><i class="bi bi-clock me-2 text-danger"></i>訂位保留 10 分鐘，逾時將自動取消。</li>
              <li><i class="bi bi-people me-2 text-danger"></i>6 人以上用餐或包場請直接來電預約。</li>
              <li><i class="bi bi-coin me-2 text-danger"></i>最低消費每人 NT$ 350。</li>
            </ul>
          </div>
          <div class="col-lg-7">
            <form class="bg-white p-4 rounded-4 shadow-sm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">姓名</label>
                  <input type="text" class="form-control" required placeholder="請輸入姓名">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">電話號碼</label>
                  <input type="tel" class="form-control" required placeholder="0912-345-678">
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">用餐人數</label>
                  <select class="form-select" required>
                    <option value="1">1 位</option>
                    <option value="2" selected>2 位</option>
                    <option value="3">3 位</option>
                    <option value="4">4 位</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">日期</label>
                  <input type="date" class="form-control" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">時間</label>
                  <select class="form-select" required>
                    <option>12:00</option>
                    <option>18:00</option>
                    <option>19:00</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label fw-bold">特殊需求 (選填)</label>
                  <textarea class="form-control" rows="2" placeholder="如：兒童座椅、慶生等..."></textarea>
                </div>
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-custom w-100 py-2 fs-5">送出預約表單</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-4 text-center">
    <div class="container">
      <p class="mb-0 small text-secondary">&copy; 2026 Ristorante Gusto. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
