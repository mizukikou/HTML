<!DOCTYPE html>
<!--
=========================================================
    專案名稱：Bella Vista 義式餐廳官方網站
    Chapter 01：建立網站基本架構（單一檔案版）

    作者：你的名字
    使用技術：
    ✔ HTML5
    ✔ CSS3
    ✔ Bootstrap 5
    ✔ JavaScript (ES6)
=========================================================
-->

<html lang="zh-Hant">

<head>

    <!-- ==========================================
         網頁基本設定
    =========================================== -->

    <!-- 指定文字編碼，避免中文亂碼 -->
    <meta charset="UTF-8">

    <!-- 響應式網頁設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 網頁標題 -->
    <title>Bella Vista 義式餐廳</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
          rel="stylesheet">

    <!-- ==========================================
         CSS 樣式
    =========================================== -->
    <style>

        /* ==========================
           全站基本設定
        ========================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:"Noto Sans TC",sans-serif;

            background:#FFFDF8;

            color:#333;

            line-height:1.8;

        }

        a{

            text-decoration:none;

        }

        img{

            max-width:100%;

            display:block;

        }

        /* ==========================
           Header
        ========================== */

        header{

            background:#2E8B57;

            color:white;

            padding:40px 0;

            text-align:center;

        }

        header h1{

            font-size:3rem;

            font-weight:bold;

        }

        header p{

            margin-top:10px;

            font-size:1.2rem;

        }

        /* ==========================
           Main
        ========================== */

        main{

            padding:60px 20px;

        }

        .welcome-box{

            max-width:900px;

            margin:auto;

            text-align:center;

        }

        .welcome-box h2{

            color:#2E8B57;

            margin-bottom:20px;

        }

        /* ==========================
           Footer
        ========================== */

        footer{

            background:#333;

            color:white;

            text-align:center;

            padding:20px;

        }

        /* ==========================
           RWD
        ========================== */

        @media (max-width:768px){

            header h1{

                font-size:2rem;

            }

        }

    </style>

</head>

<body>

<!-- =====================================================
     Header
===================================================== -->

<header>

    <div class="container">

        <h1>
            <i class="bi bi-shop"></i>
            Bella Vista
        </h1>

        <p>
            義式美食．現點現做．幸福每一刻
        </p>

    </div>

</header>

<!-- =====================================================
     Main
===================================================== -->

<main>

    <div class="container">

        <div class="welcome-box">

            <h2>歡迎來到 Bella Vista 義式餐廳</h2>

            <p>

                本專案將帶領你一步一步完成一個完整的餐廳官方網站。

            </p>

            <br>

            <p>

                本章先完成網站基本架構，
                下一章將開始製作 Bootstrap Navbar、
                Carousel 以及首頁內容。

            </p>

            <br>

            <button class="btn btn-success btn-lg">

                開始學習

            </button>

        </div>

    </div>

</main>

<!-- =====================================================
     Footer
===================================================== -->

<footer>

    Bella Vista Restaurant © 2026

</footer>

<!-- =====================================================
     Bootstrap JavaScript
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- =====================================================
     JavaScript
===================================================== -->

<script>

"use strict";

/*==========================================
    網頁載入完成後執行
==========================================*/

document.addEventListener("DOMContentLoaded", function(){

    console.log("Bella Vista 網站載入完成！");

    alert("歡迎來到 Bella Vista 義式餐廳！");

});

</script>

</body>

</html>
