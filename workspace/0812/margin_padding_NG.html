<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失敗範例 - Margin 穿透塌陷（附詳細註解版）</title>
    <style>
        /* ========================================================
           1. 網頁基礎重設 (Reset)
           ======================================================== */
        body {
            margin: 0;        /* 清除瀏覽器預設給 body 的外邊距（通常是 8px） */
            padding: 0;       /* 清除瀏覽器預設的內邊距 */
            font-family: Arial, sans-serif;
        }

        /* ========================================================
           2. 頂部黃色基準線（用來視覺對比，觀察有沒有裂開空隙）
           ======================================================== */
        .header-line {
            width: 100%;             /* 寬度佔滿整個螢幕 */
            height: 50px;            /* 高度固定 50px */
            background-color: #f1c40f; /* 顯眼的黃色背景 */
            text-align: center;      /* 文字水平置中 */
            line-height: 50px;       /* 行高與高度相同，使文字垂直置中 */
            font-weight: bold;       /* 文字加粗 */
        }

        /* ========================================================
           3. ❌ 失敗的父元素（紅色方塊）
           ======================================================== */
        .parent-fail {
            width: 200px;            /* 寬度 200px */
            height: 200px;           /* 高度 200px */
            background-color: #e74c3c; /* 顯眼的紅色背景 */
            color: white;            /* 內部文字顏色為白色 */
            
            /* 💡 塌陷原因分析：
               此處「沒有」設定 border（邊框），也「沒有」設定 padding（內邊距）。
               當一個父元素頂部是空的時候，它就沒有任何實體防線。
               子元素的 margin-top 就會像幽靈一樣直接穿透出去，轉而推擠父元素的外部。 */
        }

        /* ========================================================
           4. ❌ 失敗的子元素（藍色方塊）
           ======================================================== */
        .child-fail {
            width: 100px;            /* 寬度 100px */
            height: 100px;           /* 高度 100px */
            background-color: #3498db; /* 顯眼的藍色背景 */
            color: white;            /* 內部文字顏色為白色 */
            text-align: center;      /* 文字水平置中 */
            line-height: 100px;      /* 行高與高度相同，使文字垂直置中 */
            
            /* 💥 這是引發塌陷的罪魁禍首：
               我們本意是希望藍色方塊距離紅色方塊頂部往下推 40px。
               但因為父元素頂部是空的，這 40px 的力量直接「穿透」了紅色父元素。
               結果：藍色依然緊貼紅色頂部，反而導致「整個紅色方塊」集體與黃色基準線裂開 40px。 */
            margin-top: 40px; 
        }
    </style>
</head>
<body>

    <!-- 頂部基準線：如果發生塌陷，下方紅色方塊會與這條黃線分離 -->
    <div class="header-line">網頁頂部黃色基準線</div>

    <!-- 
      💡 HTML 觀察重點：
      1. 父元素 <div> 內部現在「完全沒有任何文字」，直接緊接著子元素 <div>。
      2. 之前因為有「父元素 (200x200)」這行文字阻擋，文字像一道牆把子元素的 margin 擋在裡面。
      3. 現在把文字刪除後，防線完全消失，外邊距塌陷（穿透）現象就會 100% 成功顯現！
    -->
    <div class="parent-fail">
        <div class="child-fail">子元素</div>
    </div>

</body>
</html>
