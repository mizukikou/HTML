<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於我們 - 賽博版</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            background-color: #0f172a; 
            color: #e2e8f0;           
            line-height: 1.8;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 📱 頂部導航列：完全還原原圖的圓角與深色反白樣式 */
        nav {
            background-color: #38bdf8; 
            padding: 12px 24px;
            border-radius: 30px; /* 膠囊狀圓角 */
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            display: flex;
            gap: 5px;
        }
        nav a, nav b {
            text-decoration: none;
            padding: 6px 14px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* 🔄 導航列未選中項目：深色文字（對應原圖首頁與聯絡我們） */
        nav a {
            color: #0f172a;
        }
        nav a:hover {
            color: #ffffff;
            background-color: rgba(15, 23, 42, 0.15);
            border-radius: 20px;
        }

        /* 💡 精準修正：當前頁面標題（關於我們）進行「背景深色、文字白亮」的反白處理 */
        nav b {
            color: #ffffff;               /* 文字改為白色 */
            background-color: #0f172a;    /* 背景反白為深色 */
            border-radius: 20px;          /* 精緻內扣圓角 */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); /* 增加立體層次 */
        }

        /* 🎨 下方大標題：維持先前設定的反白黑體 */
        h1 {
            font-family: "Arial Black", Impact, sans-serif; 
            color: #0f172a;               
            background-color: #f97316;    
            display: inline-block;        
            padding: 6px 18px;            
            font-weight: 900;
            border-radius: 4px;           
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.6); 
            margin-top: 50px;             
        }

        /* 🎨 次標題：亮文字與底部虛線 */
        h2 {
            font-family: "Arial Black", Impact, sans-serif; 
            color: #f97316;               
            font-weight: 900;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.6); 
            margin-top: 80px; 
            border-bottom: 2px dashed #334155; 
            padding-bottom: 10px;
            display: block;               
        }

        .intro-box {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #334155;
            border-left: 5px solid #f97316; 
            margin-top: 25px;
        }
        .highlight {
            color: #f97316;
            font-weight: bold;
        }

        /* 👽 外星人卡片 */
        .alien-container {
            background-color: #1e293b;
            width: 180px;
            height: 180px;
            padding: 15px;
            border-radius: 50%; 
            border: 3px solid #f97316; 
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.4); 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <!-- 1. 頂部導航列（已將「關於我們」套用精準反白特效） -->
    <nav>
        <a href="../index.html">首頁</a> 
        <b>關於我們</b> 
        <a href="contact.html">聯絡我們</a>
    </nav>

    <!-- 2. 反白樣式大標題 -->
    <h1>關於我們</h1>
    
    <!-- 3. 內文簡介區塊 -->
    <div class="intro-box">
        <p>歡迎來到我們的空間！我們是一個專注於網頁前端技術的學習團隊。</p>
        <p>配合層級的切換，你可以注意到導航列中的<strong class="highlight">「關於我們」已套用黑底白字的反白選取特效</strong>。現在這裡由綠色外星人為你駐守！</p>
    </div>

    <!-- 4. 次標題 -->
    <h2>專屬星際居民</h2>
    
    <!-- 5. 漂浮的綠色外星人（SVG） -->
    <div class="alien-container">
        <svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100%" height="100%">
            <!-- 天線 -->
            <path d="M 35,25 L 25,10" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
            <path d="M 65,25 L 75,10" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
            <circle cx="25" cy="10" r="5" fill="#22c55e" />
            <circle cx="75" cy="10" r="5" fill="#22c55e" />
            
            <!-- 外星人頭部 -->
            <path d="M 20,45 C 20,20 80,20 80,45 C 80,68 65,85 50,85 C 35,85 20,68 20,45 Z" fill="#4ade80"/>
            
            <!-- 大黑眼睛 -->
            <ellipse cx="38" cy="48" rx="10" ry="14" fill="#0f172a" transform="rotate(-15 38 48)"/>
            <ellipse cx="62" cy="48" rx="10" ry="14" fill="#0f172a" transform="rotate(15 62 48)"/>
            
            <!-- 眼睛反光點 -->
            <circle cx="41" cy="43" r="3" fill="#ffffff"/>
            <circle cx="59" cy="43" r="3" fill="#ffffff"/>
            
            <!-- 小嘴巴 -->
            <path d="M 44,68 Q 50,73 56,68" stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
    </div>

</body>
</html>
