<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>行內樣式表</title>
  </head>
  <!-- 行內樣式 Inline CSS：維護較困難，建議僅用於少量快速修改 -->
  <body style="color: white; background: deepskyblue;">
    <h1>Hello, CSS!</h1>
    <p style="font-size: 1.2rem;">這是一段示範文字，使用內嵌 CSS 設定字體大小。</p>
    <h1 style="color: yellow; background: rgb(63, 226, 104);">這是另一個標題</h1>
  </body>
</html>
