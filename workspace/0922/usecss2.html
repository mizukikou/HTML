<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>內部樣式表範例</title>
    <!-- 內部樣式表 (Internal CSS) 是比較進步且推薦的現代寫法 -->
    <style>
      body {color: white; background: deepskyblue;}
      h1 {color: yellow; background: rgb(63, 226, 104);}
    </style>
  </head>
  <body>
    <h1>Hello, CSS!</h1>
  </body>
</html>
