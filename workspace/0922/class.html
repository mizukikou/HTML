<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>我的網頁</title>
    <style>
      /* 在 <style> 標籤中，使用了類別選擇器（以小數點 . 開頭）來定義兩種不同的背景顏色，分別應用於奇數列和偶數列。 */
      .odd {background: linen;}				/*類別選擇器*/
      .even {background: lightblue;}		/*類別選擇器*/
    </style>
  </head>
  <body>
    <table>
      <tr class="odd"><td>01</td><td>鳶尾花</td></tr>
      <tr class="even"><td>02</td><td>滿天星</td></tr>
      <tr class="odd"><td>03</td><td>香水百合</td></tr>
      <tr class="even"><td>04</td><td>鬱金香</td></tr>
    </table>
  </body>
</html>


<!-- 如果沒有類別選擇器，網頁設計會陷入兩種極端：要嘛所有標籤長得一模一樣，要嘛每一行都得寫重複的程式碼。
使用類別選擇器可以讓我們針對特定元素套用相同的樣式，而不影響其他元素，達到程式碼重用與設計靈活性的平衡。 -->
