<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>旅遊圖片輪播</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container my-5">
    <h2 class="text-center mb-4">旅遊圖片輪播</h2>
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
	   <!-- 輪播內容 -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="tour1.jpg" class="d-block w-100" alt="圖片1">
        </div>
        <div class="carousel-item">
          <img src="tour2.jpg" class="d-block w-100" alt="圖片2">
        </div>
        <div class="carousel-item">
          <img src="tour3.jpg" class="d-block w-100" alt="圖片3">
        </div>
      </div>
      <!-- 輪播控制 -->
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">上一張</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">下一張</span>
      </button>
      <!-- 輪播指示 -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="第1張"></button>
        <button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="1" aria-label="第2張"></button>
        <button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="2" aria-label="第3張"></button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
