<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="description" content="這是專門介紹網頁基礎的教學網站，幫助新手快速入門。">
    <meta property="og:title" content="【必看】網頁新手村指南">
  </head>
  <body>
    <table border="1">
      <thead>    
          <tr>
            <th>角色</th>
            <th>人物描述</th>
          </tr>
      </thead>
      <tbody>
        <tr>
          <td>芙莉蓮</td>
          <td>精靈魔法使，與夥伴擊敗魔王後，獨自踏上探索情感的旅程。</td>
        </tr>
        <tr>
          <td>欣梅爾</td>
          <td>溫柔的勇者，他是芙莉蓮漫長旅途中重要且思念的夥伴。</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">註：「葬送的芙莉蓮」人物介紹</td>
        </tr>
      </tfoot>
    </table>

    <!-- thead tbody tfoot 這三個標籤用來將表格的內容分組（分類）。讓瀏覽器、搜尋引擎（SEO）和螢幕閱讀器完美看懂表格的結構： -->
    
    <table border="1">
      <!-- 1. 表頭區 -->
      <thead>
        <tr>
          <th>商品名稱</th>
          <th>價格</th>
        </tr>
      </thead>

      <!-- 2. 資料主體區 -->
      <tbody>
        <tr>
          <td>葬送的芙莉蓮公仔</td>
          <td>$1,200</td>
        </tr>
        <tr>
          <td>費倫法杖模型</td>
          <td>$850</td>
        </tr>
      </tbody>

      <!-- 3. 表尾區 -->
      <tfoot>
        <tr>
          <td>總計金額</td>
          <td>$2,050</td>
        </tr>
      </tfoot>
    </table>

  </body>
</html>
