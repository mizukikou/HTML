<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      table {
        border-collapse: collapse;
        border: 3px solid rgb(226, 16, 86);
        width: 50%;
        margin: 50px auto;
      }
      th, td {
        padding: 10px;
        text-align: left;
      }
      caption {
        font-size: 1.5em;
        margin-bottom: 10px;
      }
      table, th, td {
        border: 2px solid rgb(226, 16, 86);
      }
    </style>
  </head>
  <body>
	<table>
	  <caption>葬送的芙莉蓮</caption>
      <tr>
        <th>角色</th>
        <th>人物描述</th>
      </tr>
      <tr>
        <td>芙莉蓮</td>
        <td>精靈魔法使，與夥伴擊敗魔王後，獨自踏上探索情感的旅程。</td>
      </tr>
      <tr>
        <td>欣梅爾</td>
        <td>溫柔的勇者，他是芙莉蓮漫長旅途中重要且思念的夥伴。</td>
      </tr>
    </table>
  </body>
</html>
