<!DOCTYPE html>
<html>
	<head><title>文字格式</title></head>
	<body>
		<!-- sup是上標字，sub是下標字 -->
    <!-- small 是小號字 -->
        <h2>靜夜思 <span style="vertical-align: super; font-size: 60%;">李</span>
          <span style="vertical-align: sub; font-size: 60%;">白</span></h2>
		<p>
			<!-- b和strong是粗體字 -->
      <!-- mark是標記 -->
			<span style="font-weight: bold;">床前明月光，</span>
      <strong><span style="background-color: chartreuse;">疑是地上霜。</span></strong><br>
			<!-- i和em是斜體字 -->
       <!-- s是刪除線 -->
			<span style="font-style: italic;">舉頭望明月,低頭</span>
      <span style="text-decoration: line-through;">吃便當</span>思故鄉。
		</p>
		<!-- u和ins是底線 -->
		<u>
			月光舖在床前的地上，
			像是一層瑩白的濃霜。
		</u>
		<ins>
			抬頭眺望窗外的明月，
			低頭思念久別的故鄉。
		</ins>
		<!-- todo:核對整理表 -->
    <br>
    <ruby>漢<rt style="font-size: large;">ㄏㄢˋ</rt></ruby>
    <ruby>字<rt style="font-size: large;">ㄗˋ</rt></ruby>

	</body>
</html>
