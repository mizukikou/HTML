<!DOCTYPE html>
<html>
	<head><title>文字格式</title></head>
	<body>
		<!-- sup是上標字，sub是下標字 -->
    <!-- small 是小號字 -->
        <h2>靜夜思 <sup><small style="font-size: 60%;">李</small></sup><sub style="font-size: 60%;">白</sub></h2>
		<p>
			<!-- b和strong是粗體字 -->
			<b>床前明月光，</b><strong><mark>疑是地上霜。</mark></strong><br>
			<!-- i和em是斜體字 -->
       <!-- s是刪除線 -->
			<i>舉頭望明月</i>，<em>低頭<s>吃</s>思故鄉。</em>
		</p>
		<!-- u和ins是底線 -->
		<u>
			月光舖在床前的地上，
			像是一層瑩白的濃霜。
		</u>
		<ins>
			抬頭眺望窗外的明月，
			低頭思念久別的故鄉。
		</ins>
		<!-- todo:核對整理表 -->
	</body>
</html>
