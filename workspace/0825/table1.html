<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
        table {
          border-collapse: collapse; /* 合併邊框 */
          width: 100%;
        }

        th, td {
          border: 1px solid #ddd;
          padding: 12px;
        }

        /* 奇數列灰色（斑馬線效果） */
        tr:nth-child(odd) {
          background-color: #f9f9f9;
        }

        /* ⚡️ 關鍵：滑鼠移上去時，整列背景變色，並產生手指光標 */
        tr:hover {
          background-color: #1bceb6; /* 淡淡的藍灰色 */
          cursor: pointer;           /* 光標變成超連結的手指形狀 */
        }

    </style>
  </head>
  <body>
	  <table border="1">
      <tr>
        <th>角色</th>
        <th>人物描述</th>
        <th>trst</th>
      </tr>
      <tr>
        <td>芙莉蓮</td>
        <td>精靈魔法使，與夥伴擊敗魔王後，獨自踏上探索情感的旅程。</td>
        <td>test</td>
        <td>tygh</td>
      </tr>
      <tr>
        <td>欣梅爾</td>
        <td>溫柔的勇者，他是芙莉蓮漫長旅途中重要且思念的夥伴。</td>
      </tr>
    </table>
  </body>
</html>
