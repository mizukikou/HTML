<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * {
        margin: 0;   
        padding: 0;
        box-sizing: border-box; /* 防止寬度被 border 或 padding 撐破 */
      }
      
      /* 讓 html 和 body 100% 滿版，並宣告為 flex 垂直排列 */
      html, body {
        height: 100%;
      }
      body {
        width: 100%; 
        min-width: 600px; 
        max-width: 960px; 
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }
      
      header { width: 100%; background: #eaeaea; }
       nav    { width: 100%; background:  rgb(26, 14, 14); color: white; }  

      /* 💡 新增：讓中間的 main 與 aside 順利並排的外殼 */
      .container {
        display: flex;  /* 關鍵：讓內部的 main 與 aside 左右並排 */
        width: 100%;
      }

      /* 調整寬度，移除原本的 min-height，Flexbox 會自動讓兩欄等高 */
      main {
        width: 70%;  
        background: skyblue; 
      }
      
      aside {
        width: 30%;  
        background: pink;    
      }

      section { width: 100%; background: #eaeaea; margin-bottom: 10px; }
      article { width: 100%; background: #eaeaea; margin-bottom: 10px; }
      
      footer {
        width: 100%; 
        background: #eaeaea; 
        margin-top: auto; /* 💡 關鍵：自動把 footer 推到最下方 */
      }
      
      nav ul {
        text-align: center;
      }    
      nav ul li {
        display: inline;
      }
      /* 💡 */
      nav ul li a:hover {
        color: #ffcccc; /* 滑鼠移過去時變成淡粉紅色 *//
      }
    </style>
  </head>
  <body>
    <header>
      <h1>手機王</h1>
      <p>找手機、修手機、賣手機，手機專家就在這裡！</p>
    </header>

    <nav>
	    <ul>
	      <li><a href="index.html">首頁</a></li>
        <li><a href="products.html">產品型錄</a></li>
        <li><a href="stores.html">銷售門市</a></li>
        <li><a style="color:chocolate">關於我們</a></li>
	    </ul>
	  </nav>

    <!-- 💡 步驟 1：用 .container 標籤把 main 和 aside 包裹起來 -->
    <section>
      <h2>關於我們</h2>
      <p>我們是一家專注於網頁前端技術教學的團隊，致力於推廣 HTML5 語意化標籤。</p>
      <p>透過結構化的網頁設計，讓每個人都能寫出對搜尋引擎友善的優質網站。</p>
    </section>

    <footer>
      <p>&copy; 2025快樂通訊公司</p>
      <p><a href="#">Back to top</a></p>
    </footer>

  </body>
</html>
