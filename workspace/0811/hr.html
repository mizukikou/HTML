<!DOCTYPE html> 
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
  <!-- 使用 inline-block 容器包裹後，這個盒子的寬度會被裡面的文字內容「剛好撐開」 -->
  <div style="display: inline-block;">
    <p style="margin-bottom: 0; font-size: 30px;">春曉</p>
    <hr style="margin-top: 1px; width: 100%; border-color:rgb(194, 55, 141); border-width: 5px;">
  </div>
	<p>春眠不覺曉，處處聞啼鳥；夜來風雨聲，花落知多少？</p>
	<hr>
  <p style="text-decoration-line:underline;text-underline-offset: 5px;text-decoration-color: rgb(209, 57, 121);text-decoration-thickness: 5px;">送別</p>
	<p>山中相送罷，日暮掩柴扉。春草明年綠，王孫歸不歸。</p>
	<hr>
  <p>相思</p>
	<p>紅豆生南國，春來發幾枝？願君多采擷，此物最相思。</p>
  <hr style="height: 5px;background-color: aquamarine;border: 5px solid rgb(226, 43, 128);">
  </body>
</html>
