<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    空白行可以選到<br><br>空白行可以選到
    <!-- 段落標籤的特性
         1.在標籤的前後自動換行,且上個標籤結束的換行與下個標籤開始的換行會重疊。
         2.上下間距會重疊(取大者)，例如：上段落的下間距10px，下段落的上間距20px，則兩段落之間的間距為20px
         3.寬度預設為100%，高度為auto
     -->
    <p>段落文字</p>
    <h1>標題1</h1>
    <h2>標題2</h2>
    <h3>標題3</h3>
    <h4>標題4</h4>
    <h5>標題5</h5>
    <h6>標題6</h6>
  </body>
</html>
