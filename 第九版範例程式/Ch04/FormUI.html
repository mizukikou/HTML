<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>年齡調查表單</title>
</head>
<body>
  <form action="#" method="post">
    <p>
      <label for="name">姓名：</label>
      <input type="text" id="name" name="name">
    </p>
    <p>年齡：
      <input type="radio" name="age" value="under20"> 未滿20歲
      <input type="radio" name="age" value="20s"> 20~29歲
      <input type="radio" name="age" value="30s"> 30~39歲
      <input type="radio" name="age" value="40plus"> 40歲以上
	</p>
    <p><input type="submit" value="提交"></p>
  </form>
</body>
</html>
