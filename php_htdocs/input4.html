<?php
// =========================================================================
// 1. 【核心邏輯處理區】（放最前面）
// =========================================================================

// 自動獲取伺服器當天的最新日期（例如：2026-09-08）
// 用來當作日曆選擇器的上限值，防止選擇未來的日期
$today_date = date('Y-m-d'); 

// 設定欄位剛打開時的初始預設生日（例如預設為 2000-01-01，可依需求調整）
$default_birth = "2000-01-01";
?>

<!DOCTYPE html>
<!-- 建議加上 lang 屬性，利於搜尋引擎（SEO）與瀏覽器翻譯辨識 -->
<html lang="zh-Hant-TW">
<head>
    <!-- 指定網頁編碼為 UTF-8，確保中文字能完美顯示不變亂碼 -->
    <meta charset="utf-8">
    <!-- 加上可視區域設定，讓表單在手機或平板上瀏覽時不會縮得太小 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日表單提交</title>
</head>
<body>

    <!-- ========================================================================= -->
    <!-- 2. 【畫面單純輸出區】（放 body 內） -->
    <!-- ========================================================================= -->
    
    <!-- 
      【表單優化】：
      - action：指向您負責處理數據的後端檔案 input4data.php。
      - method：強烈建議改用 "post"。生日屬於用戶隱私，用 post 傳送才不會將生日暴露在網址列上。
    -->
    <form action="input4data.php" method="post">
      
      <p>
          <label for="birthday">生日：</label>
          <!-- 
            【日期輸入框優化】：
            - type="date"：瀏覽器會自動彈出美觀的互動式日曆視窗。
            - value     ：透過 PHP 動態印出預設日期（2000-01-01）。
            - max       ：透過 PHP 動態綁定今天的日期，這樣明天以後的日期都會變灰色、無法點選。
          -->
          <input type="date" 
                 id="birthday" 
                 name="birthday" 
                 value="<?php echo $default_birth; ?>" 
                 max="<?php echo $today_date; ?>">
      </p>
      
      <!-- 
        【按鈕語法修正】：
        - 原代碼 <button type="submit"提交"</button> 語法嚴重破損，遺漏了右角括號 >。
        - 修正為標準現代寫法：將按鈕文字「提交」夾在標籤中間即可。
      -->
      <button type="submit">提交</button>
      <button type="reset">重設</button>
      
    </form>

</body>
</html>
