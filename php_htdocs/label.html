<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <form>
      性別：
      <input type="radio" name="gender" id="male" value="男">
      <label for="male">男</label>
      <input type="radio" name="gender" id="female" value="女">
      <label for="female">女</label>
      <p>您使用過那些廠牌的手機?</p>
      <input type="checkbox" name="phone[]" id="htc" value="1" checked>
      <label for="htc">HTC</label>
      <input type="checkbox" name="phone[]" id="apple" value="2">
      <label for="apple">APPLE</label>
      <input type="checkbox" name="phone[]" id="asus" value="3">
      <label for="asus">ASUS</label>
      <input type="checkbox" name="phone[]" id="sony" value="4">
      <label for="sony">SONY</label>
      <br>
      <input type="submit" value="提交"><input type="reset" value="重設">
    </form>
  </body>
</html>
